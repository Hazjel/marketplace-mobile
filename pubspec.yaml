name: blukios_marketplace
description: Blukios Marketplace - Flutter Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10
  pull_to_refresh: ^2.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  app_links: ^6.3.3
  webview_flutter: ^4.10.0
  web_socket_channel: ^3.0.1
  image_picker: ^1.1.2
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_secure_storage_platform_interface: ^1.1.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/brand/

# App launcher icon — source: e:\blue\fe-blue\src\assets\images\logos\logo-notext.svg
# (Blukios' icon-only mark, rasterized to assets/brand/app_icon.png). Run
# `dart run flutter_launcher_icons` after changing this to regenerate the
# platform icon files.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app_icon.png"
  min_sdk_android: 21

# path_provider_android >=2.3.0 switched to JNI-based codegen (jni/jni_flutter)
# whose generated bindings reference a `java.io.File` shim that isn't present
# in the published package — it fails to compile in this Flutter/Dart SDK
# combo. 2.2.x uses the older, stable Pigeon codegen.
dependency_overrides:
  path_provider_android: 2.2.17

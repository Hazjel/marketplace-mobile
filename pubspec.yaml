name: blukios_marketplace
description: Blukios Marketplace - Flutter Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10
  pull_to_refresh: ^2.0.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  app_links: ^6.3.3
  webview_flutter: ^4.10.0
  web_socket_channel: ^3.0.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  flutter_secure_storage_platform_interface: ^1.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/brand/

# path_provider_android >=2.3.0 switched to JNI-based codegen (jni/jni_flutter)
# whose generated bindings reference a `java.io.File` shim that isn't present
# in the published package — it fails to compile in this Flutter/Dart SDK
# combo. 2.2.x uses the older, stable Pigeon codegen.
dependency_overrides:
  path_provider_android: 2.2.17
